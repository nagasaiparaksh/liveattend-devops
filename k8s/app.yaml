# LiveAttend web app: 2 replicas behind a Service. Jenkins replaces IMAGE_PLACEHOLDER with the image it just pushed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liveattend
  namespace: liveattend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: liveattend }
  template:
    metadata:
      labels: { app: liveattend }
    spec:
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          ports: [{ containerPort: 8000 }]
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: liveattend, key: db-password } }
            - name: DATABASE_URL
              value: postgresql+psycopg://liveattend:$(DB_PASSWORD)@postgres:5432/liveattend
            - name: SECRET_KEY
              valueFrom: { secretKeyRef: { name: liveattend, key: secret-key } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: liveattend, key: admin-password } }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: liveattend
  namespace: liveattend
spec:
  type: NodePort
  selector: { app: liveattend }
  ports: [{ port: 80, targetPort: 8000 }]
