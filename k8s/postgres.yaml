# PostgreSQL for LiveAttend: one pod, data on a PersistentVolumeClaim, password from the "liveattend" Secret
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: liveattend
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: liveattend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: liveattend }
            - { name: POSTGRES_USER, value: liveattend }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: liveattend, key: db-password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "liveattend"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: liveattend
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
