<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LiveAttend{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('index') }}">Live<b>Attend</b></a>
  <nav>
    {% if user %}
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="link">Log out ({{ user.username }})</button></form>
    {% else %}
      <a href="{{ url_for('login') }}">Faculty login</a>
    {% endif %}
  </nav>
</header>
<main>
  {% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
  {% block body %}{% endblock %}
</main>
<footer>LiveAttend v{{ version }} · build #{{ build }} · commit {{ commit }} · served by {{ server }}</footer>
</body>
</html>
