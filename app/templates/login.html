{% extends "base.html" %}
{% block body %}
<section class="card narrow">
  <h2>{{ "Create faculty account" if mode == "register" else "Faculty login" }}</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Username <input name="username" required maxlength="40" autofocus></label>
    <label>Password <input name="password" type="password" required></label>
    <button class="btn">{{ "Register" if mode == "register" else "Log in" }}</button>
  </form>
  <p class="muted">{% if mode == "register" %}Have an account? <a href="{{ url_for('login') }}">Log in</a>{% else %}New here? <a href="{{ url_for('register') }}">Create an account</a>{% endif %}</p>
</section>
{% endblock %}
