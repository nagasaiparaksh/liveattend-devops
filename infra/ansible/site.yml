# Configures the EC2 server created by Terraform and deploys LiveAttend.
# Called by Jenkins with: -e @.generated/vars.json  (image, build_number, db_password, admin_password, secret_key)
- name: Configure server and deploy LiveAttend
  hosts: liveattend
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait until the new server accepts SSH
      ansible.builtin.wait_for_connection:
        timeout: 300
    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - docker
    - liveattend
