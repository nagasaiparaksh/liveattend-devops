# Local run of the same stack that Ansible deploys on EC2:  docker compose up --build --watch
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: liveattend
      POSTGRES_USER: liveattend
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-only}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U liveattend"], interval: 5s, retries: 10 }
  app:
    build: ./app
    image: liveattend:local
    environment:
      DATABASE_URL: postgresql+psycopg://liveattend:${DB_PASSWORD:-local-dev-only}@db:5432/liveattend
      SECRET_KEY: ${SECRET_KEY:-local-dev-secret}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-change-me}
    depends_on: { db: { condition: service_healthy } }
    ports: ["8200:8000"]
    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app
          ignore: [.venv/, __pycache__/, tests/, "*.db"]
        - action: rebuild
          path: ./app/requirements.txt
volumes: { dbdata: {} }
